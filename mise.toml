[tools]
python = "3.13.18"
uv = "0.13.8"
sccache = "0.19.0"
rust = "1.100.0"

[env]
_.python.venv = { path = ".venv", create = true }
SCCACHE_CACHE_SIZE = "50G"

[tasks.deps]
description = "Install the Python packages the build scripts import"
run = "uv pip install --quiet requests==2.34.2 pillow==13.0.0"

[tasks.setup]
description = "Download Chromium, apply the patches and generate the build files"
depends = ["deps"]
run = "zsh -c 'unset GOROOT GOBIN GOTOOLDIR; source dev.sh && he setup'"

[tasks.build]
description = "Build the development binary"
run = "zsh -c 'unset GOROOT GOBIN GOTOOLDIR; source dev.sh && he build'"

[tasks.start]
description = "Run the development build with its own data directory"
run = "zsh -c 'source dev.sh && he run'"

[tasks.release]
description = "Build the release app from a clean source tree"
depends = ["deps"]
run = "bash -c 'unset GOROOT GOBIN GOTOOLDIR; set -euo pipefail; source devutils/shared.sh; prepare_sources true; configure_build arm64 release; helium_build chrome/installer/mac'"

[tasks.ctl-check]
description = "Format, lint and test gidoractl"
dir = "{{config_root}}/gidoractl"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets --all-features --locked -- -D warnings",
  "cargo test --locked",
]

[tasks.ctl-install]
description = "Install gidoractl into ~/.local/bin"
run = 'cargo install --locked --path gidoractl --root "$HOME/.local"'

[tasks.e2e]
description = "Run gidoractl against the dev build on a temporary profile"
run = [
  "cargo build --release --locked --manifest-path gidoractl/Cargo.toml",
  "python3 gidoractl/e2e/e2e.py",
]

[tasks.release-update]
description = "Rebuild the release app after a source change, without fetching sources again"
run = "bash -c 'unset GOROOT GOBIN GOTOOLDIR; set -euo pipefail; source devutils/shared.sh; helium_build chrome/installer/mac'"

[tasks.sign]
description = "Sign the release app with the Developer ID certificate, without notarization"
dir = "{{config_root}}/build/src"
run = '''
#!/usr/bin/env bash
set -euo pipefail
identity=$(security find-identity -v -p codesigning | sed -n 's/^ *[0-9]*) [0-9A-F]* "\(Developer ID Application: .*\)"$/\1/p' | head -1)
if [ -z "$identity" ]; then
  echo "no Developer ID Application identity in the keychain" >&2
  exit 1
fi
# spctl --assess rejects an app that is not notarized, and sign_chrome.py
# treats that as a signing failure, so a shim answers for it.
shim="$PWD/out/spctl-shim"
mkdir -p "$shim"
printf '#!/bin/sh\necho "spctl assessment skipped: the app is not notarized"\nexit 0\n' > "$shim/spctl"
chmod +x "$shim/spctl"
rm -rf out/Default/signed
PATH="$shim:$PATH" python3 "out/Default/Gidora Packaging/sign_chrome.py" \
  --input out/Default --output out/Default/signed --identity "$identity" \
  --disable-packaging --notarize none
app=$(find out/Default/signed -maxdepth 3 -name Gidora.app | head -1)
codesign --verify --deep --strict "$app"
"$app/Contents/MacOS/Gidora" --version
echo "signed: $PWD/$app"
'''

[tasks.dmg]
description = "Sign and notarize the release app, then package it into a notarized DMG"
dir = "{{config_root}}/build/src"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# The profile is created once with `xcrun notarytool store-credentials`.
profile="${GIDORA_NOTARY_PROFILE:-gidora-notary}"
identity=$(security find-identity -v -p codesigning | sed -n 's/^ *[0-9]*) [0-9A-F]* "\(Developer ID Application: .*\)"$/\1/p' | head -1)
if [ -z "$identity" ]; then
  echo "no Developer ID Application identity in the keychain" >&2
  exit 1
fi
root=$(cd ../.. && pwd)
rm -rf out/Default/signed
python3 "out/Default/Gidora Packaging/sign_chrome.py" \
  --input out/Default --output out/Default/signed --identity "$identity" \
  --disable-packaging --notarize staple --notary-arg=--keychain-profile="$profile"
app=$(find out/Default/signed -maxdepth 3 -name Gidora.app | head -1)
version=$("$app/Contents/MacOS/Gidora" --version | awk '{print $2}')
arch=$(lipo -archs "$app/Contents/MacOS/Gidora")
dmg="$root/build/Gidora-$version-$arch.dmg"
rm -f "$dmg"
chrome/installer/mac/pkg-dmg \
  --sourcefile --source "$app" --target "$dmg" \
  --volname Gidora --format ULMO \
  --icon "$app/Contents/Resources/app.icns" \
  --symlink /Applications:/Applications \
  --mkdir .background \
  --copy "$root/resources/dmg_background.png:/.background/dmg_background.png" \
  --copy "$root/resources/dmg_dsstore:/.DS_Store"
codesign --sign "$identity" --identifier space.pkarpovich.gidora --force "$dmg"
xcrun notarytool submit "$dmg" --keychain-profile "$profile" --wait
xcrun stapler staple "$dmg"
spctl --assess --type execute -vv "$app"
spctl --assess --type open --context context:primary-signature -vv "$dmg"
echo "dmg: $dmg"
'''
